[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yane"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PySide6",
    "gymnasium",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "psutil",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["yane", "yane.*"]
